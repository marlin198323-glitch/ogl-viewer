# OGL public compatibility gate: graphics controls and Vulkan RT module.
# Small, cross-platform builds. Full Firestorm GUI builds/releases use their
# separate workflows and are NOT implied by a green result here.
name: OGL portable graphics

on:
  push:
    branches: [ogl-develop]
    paths:
      - 'ogl/**'
      - 'indra/newview/oglrtxhost.*'
      - 'indra/newview/skins/**'
      - 'indra/newview/fs*.cpp'
      - 'indra/newview/fs*.h'
      - 'indra/llui/**'
      # P01: any authentication/grid/startup change must run the six-platform
      # native grid policy and Python login regression suite as well.
      - 'indra/newview/oglnexversegrid.h'
      - 'indra/newview/fspanellogin.cpp'
      - 'indra/newview/fspanellogin.h'
      - 'indra/newview/llstartup.cpp'
      - 'indra/newview/llgridmanager.cpp'
      - 'indra/newview/llgridmanager.h'
      - 'indra/newview/llpresetsmanager.cpp'
      - 'indra/newview/viewer_manifest.py'
      - 'indra/newview/app_settings/ogl/**'
      - 'indra/newview/CMakeLists.txt'
      - '.github/workflows/ogl-portable-graphics.yml'
  pull_request:
    paths:
      - 'ogl/**'
      - 'indra/newview/oglrtxhost.*'
      - 'indra/newview/skins/**'
      - 'indra/newview/fs*.cpp'
      - 'indra/newview/fs*.h'
      - 'indra/llui/**'
      # P01: any authentication/grid/startup change must run the six-platform
      # native grid policy and Python login regression suite as well.
      - 'indra/newview/oglnexversegrid.h'
      - 'indra/newview/fspanellogin.cpp'
      - 'indra/newview/fspanellogin.h'
      - 'indra/newview/llstartup.cpp'
      - 'indra/newview/llgridmanager.cpp'
      - 'indra/newview/llgridmanager.h'
      - 'indra/newview/llpresetsmanager.cpp'
      - 'indra/newview/viewer_manifest.py'
      - 'indra/newview/app_settings/ogl/**'
      - 'indra/newview/CMakeLists.txt'
      - '.github/workflows/ogl-portable-graphics.yml'
  workflow_dispatch:

permissions:
  contents: read

# A push with [windows-installer] requests a Windows test installer.
# Normal commits only run the portable graphics verification matrix.
jobs:
  windows-test-installer:
    name: OGL Windows x64 full viewer installer (unsigned)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-installer]')
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
      AUTOBUILD_VSVER: "170"
    steps:
      - name: Checkout OGL viewer
        uses: actions/checkout@v4
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install autobuild==3.10.2 llsd
          choco install nsis --yes --no-progress
      - name: Public Firestorm build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables
      - name: Configure unsigned OpenSim viewer
        shell: bash
        run: >-
          autobuild configure -c ReleaseFS_open -A64 -- --package
          --chan "OGL Viewer Development"
          -DOPENSIM:BOOL=ON
          -DHAVOK_TPV:BOOL=OFF
          -DUSE_FMODSTUDIO:BOOL=OFF
          -DUSE_KDU:BOOL=OFF
          -DUSE_DISCORD:BOOL=OFF
          -DUSE_BUGSPLAT:BOOL=OFF
          -DUSE_VELOPACK:BOOL=OFF
          -DLL_TESTS:BOOL=OFF
      - name: Build OGL Windows x64 full viewer
        shell: bash
        run: autobuild build -c ReleaseFS_open -A64 --no-configure
      - name: Verify installer exists
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -Path build-* -Recurse -Filter '*_Setup.exe' -File)
          if ($setup.Count -eq 0) { throw 'Windows viewer installer missing' }
          $setup | Select-Object FullName,Length | Format-Table -AutoSize
      - name: Upload OGL Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: OGL-Viewer-Windows-x64-unsigned-test-installer
          path: build-*/newview/Release/*_Setup.exe
          if-no-files-found: error
          retention-days: 14

  native-module:
    name: Native graphics / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 AMD/Intel, ARM64 Linux/Windows, Intel and Apple Silicon macOS.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Python source / distribution tests
        run: python -m unittest discover -s ogl/tests -p "test_*.py" -q
      - name: Linux Vulkan SDK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev ninja-build glslang-tools spirv-tools
      - name: Validate bundled Vulkan ray-query shader
        if: runner.os == 'Linux'
        run: |
          glslangValidator -V --target-env vulkan1.2 -S comp ogl/modules/rtx/shaders/ray_query_shadow.comp -o /tmp/ogl_ray_query_shadow.spv
          spirv-val --target-env vulkan1.2 /tmp/ogl_ray_query_shadow.spv
          spirv-val --target-env vulkan1.2 indra/newview/app_settings/ogl/rtx/ray_query_shadow.comp.spv
          glslangValidator -V --target-env vulkan1.2 -S comp ogl/modules/rtx/shaders/camera_sun_shadow.comp -o /tmp/ogl_camera_shadow.spv
          spirv-val --target-env vulkan1.2 /tmp/ogl_camera_shadow.spv
          spirv-val --target-env vulkan1.2 indra/newview/app_settings/ogl/rtx/camera_sun_shadow.comp.spv
          glslangValidator -V --target-env vulkan1.2 -S comp ogl/modules/rtx/shaders/depth_guided_sun.comp -o /tmp/ogl_depth_sun.spv
          spirv-val --target-env vulkan1.2 /tmp/ogl_depth_sun.spv
          spirv-val --target-env vulkan1.2 indra/newview/app_settings/ogl/rtx/depth_guided_sun.comp.spv
      - name: Windows Vulkan headers (no proprietary SDK required)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git clone --depth 1 --branch v1.3.275 https://github.com/KhronosGroup/Vulkan-Headers.git .vulkan-ci
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S ogl/modules -B build/ogl-graphics -G Ninja
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S ogl/modules -B build/ogl-graphics -DOGL_VULKAN_HEADER_DIR="$env:GITHUB_WORKSPACE/.vulkan-ci/include"
      - name: Configure macOS (Intel and Apple Silicon)
        if: runner.os == 'macOS'
        run: cmake -S ogl/modules -B build/ogl-graphics
      - name: Build portable OGL modules
        run: cmake --build build/ogl-graphics --config Release --parallel 3
      - name: Native ABI / GPU fallback tests
        run: ctest --test-dir build/ogl-graphics -C Release --output-on-failure
      - name: Check Linux Vulkan RT shared module
        if: runner.os == 'Linux'
        run: test -s build/ogl-graphics/ogl_rtx.so
      - name: Check Windows Vulkan RT DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -Path build/ogl-graphics -Filter ogl_rtx.dll -Recurse
          if (-not $dlls) { throw "No Windows OGL Vulkan RT DLL built" }
